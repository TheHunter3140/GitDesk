name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project GitDesk.xcodeproj -scheme GitDesk -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GitDesk.app Payload/
          zip -qr GitDesk.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-ipa
          path: GitDesk.ipa
